<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тест для тебя 💛</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    color: #fff;
  }
  .container {
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    padding: 30px;
    max-width: 520px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  .progress {
    height: 6px;
    background: rgba(255,255,255,0.1);
    border-radius: 3px;
    overflow: hidden;
    margin-bottom: 20px;
  }
  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, #f39c12, #e74c3c);
    width: 0%;
    transition: width 0.4s ease;
  }
  .question {
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 22px;
    line-height: 1.4;
  }
  .answers {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .answer {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 12px;
    padding: 14px 18px;
    cursor: pointer;
    font-size: 16px;
    transition: all 0.2s ease;
    text-align: left;
    color: #fff;
  }
  .answer:hover:not(:disabled) {
    background: rgba(255,255,255,0.18);
    transform: translateX(4px);
  }
  .answer:disabled { cursor: default; }
  .answer.correct {
    background: rgba(46, 204, 113, 0.25);
    border-color: #2ecc71;
  }
  .answer.wrong {
    background: rgba(231, 76, 60, 0.25);
    border-color: #e74c3c;
  }
  .reaction {
    margin-top: 18px;
    padding: 14px 18px;
    background: rgba(243, 156, 18, 0.15);
    border-left: 4px solid #f39c12;
    border-radius: 8px;
    font-size: 16px;
    opacity: 0;
    transform: translateY(10px);
    transition: all 0.3s ease;
    min-height: 0;
  }
  .reaction.show {
    opacity: 1;
    transform: translateY(0);
  }
  .next-btn {
    margin-top: 20px;
    width: 100%;
    padding: 14px;
    background: linear-gradient(90deg, #f39c12, #e74c3c);
    border: none;
    border-radius: 12px;
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s ease;
  }
  .next-btn.show {
    opacity: 1;
    pointer-events: auto;
  }
  .next-btn:hover { filter: brightness(1.1); }
  .final {
    text-align: center;
    display: none;
  }
  .final.show { display: block; }
  .final h1 {
    font-size: 26px;
    margin-bottom: 16px;
    background: linear-gradient(90deg, #f39c12, #e74c3c);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .final p {
    font-size: 17px;
    line-height: 1.6;
    margin-bottom: 24px;
    color: rgba(255,255,255,0.85);
  }
  .download-btn {
    display: inline-block;
    padding: 16px 32px;
    background: linear-gradient(90deg, #2ecc71, #27ae60);
    color: #fff;
    text-decoration: none;
    border-radius: 12px;
    font-size: 17px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    transition: all 0.2s ease;
  }
  .download-btn:hover { transform: scale(1.05); filter: brightness(1.1); }
</style>
</head>
<body>
<div class="container">
  <div class="progress"><div class="progress-bar" id="progressBar"></div></div>

  <div id="quiz">
    <div class="question" id="questionText"></div>
    <div class="answers" id="answersBox"></div>
    <div class="reaction" id="reaction"></div>
    <button class="next-btn" id="nextBtn">Далее →</button>
  </div>

  <div class="final" id="final">
    <h1>🎉 Ты прошла тест! 🎉</h1>
    <p>
      Спасибо, что поиграла!<br>
      С дркой, Варюх 💛<br><br>
      Держи подарочек ниже 👇
    </p>
    <a href="goldenapple.pdf" download class="download-btn">📄 Скачать</a>
  </div>
</div>

<script>
// ===== ВОПРОСЫ =====
const questions = [
  {
    q: "Сколько тебе исполнилось лет?",
    answers: ["67", "6", "16", "17"],
    reactions: ["я знал", "малыха", "годик назад, да", "так-то да, с дркой)"]
  },
  {
    q: "На сколько ты оценишь Сумерки?",
    answers: ["0", "5", "10", "100"],
    reactions: ["удивлен", "бледные типы", "по 100бальной шкале", "переоцененный шлак"]
  },
  {
    q: "Че тяжелее: 1 кг ваты или 1 кг железа?",
    answers: ["вата", "железо", "одинаково", "я тупая"],
    reactions: ["очевидно", "ну да, это ведь железо", "без слов", "и так знаешь"]
  },
  {
    q: "Как зовут Лану дель Рей?",
    answers: ["Elizabeth Woolridge Grant", "Lana Turner Grant", "Elizabeth Del Rey Grant", "May Jailer Grant"],
    reactions: ["внатуре угадала", "сам не знаю", "сам не знаю", "джеймс мэй"]
  },
  {
    q: "Войстег славы Мерлоу?",
    answers: ["прекрати", "слава что ты сделал", "сквозь баб детка", "диджей тейп"],
    reactions: ["да не помню я кто это", "очевидно", "без баб", "сама знаешь"]
  },
  {
    q: "Запомни цифры",
    answers: ["1", "2", "3", "4", "5", "6", "7"],
    reactions: ["жиши", "ама рокстар", "попстар встал", "чаща", "довези меня в бостон", "гагаринский дом 3", "ути какой"]
  },
  {
    q: "Че изменилось?",
    answers: ["I", "II", "III", "IIII", "V", "VI", "VII"],
    reactions: ["и че изменилось", "дабалью", "3 как 3", "ну да, чет не то", "м5 компетитион", "скоро гта 6 кста выйдет", "и че"]
  },
  {
    q: "Какого цвета миньоны?",
    answers: ["желтого", "бананового", "вкусного", "что-то между красным и зеленым"],
    reactions: ["скучно", "тигрица", "пупсики", "что же"]
  },
  {
    q: "Миньоны или Энгрибердсы?",
    answers: ["желтки", "птицы", "свиньи", "сложно"],
    reactions: ["тик так", "я бы также выбрала", "очевидно", "согласна"]
  },
  {
    q: "Ты думала будет бас?",
    answers: ["наебал", "я блогер подпишись на канал", "субскрайб", "и самый новый мерин забрал"],
    reactions: ["больше нету слов", "знаешь почему", "мне лень", "ну а че, могу себе позволить"]
  }
];

// ===== ЛОГИКА =====
let current = 0;
let answered = false;

const questionText = document.getElementById('questionText');
const answersBox = document.getElementById('answersBox');
const reaction = document.getElementById('reaction');
const nextBtn = document.getElementById('nextBtn');
const progressBar = document.getElementById('progressBar');
const quiz = document.getElementById('quiz');
const final = document.getElementById('final');

function renderQuestion() {
  answered = false;
  const q = questions[current];
  questionText.textContent = `${current + 1}. ${q.q}`;
  answersBox.innerHTML = '';
  reaction.textContent = '';
  reaction.classList.remove('show');
  nextBtn.classList.remove('show');
  nextBtn.textContent = current === questions.length - 1 ? 'Финиш 🎉' : 'Далее →';

  q.answers.forEach((ans, i) => {
    const btn = document.createElement('button');
    btn.className = 'answer';
    btn.textContent = ans;
    btn.onclick = () => selectAnswer(i, btn);
    answersBox.appendChild(btn);
  });

  progressBar.style.width = ((current) / questions.length * 100) + '%';
}

function selectAnswer(index, btn) {
  if (answered) return;
  answered = true;

  const allBtns = answersBox.querySelectorAll('.answer');
  allBtns.forEach((b, i) => {
    b.disabled = true;
    if (i === index) b.classList.add('correct');
  });

  reaction.textContent = questions[current].reactions[index];
  reaction.classList.add('show');

  nextBtn.classList.add('show');

  progressBar.style.width = ((current + 1) / questions.length * 100) + '%';
}

nextBtn.onclick = () => {
  current++;
  if (current < questions.length) {
    renderQuestion();
  } else {
    quiz.style.display = 'none';
    final.classList.add('show');
  }
};

// ===== СТАРТ =====
renderQuestion();
</script>
</body>
</html>
